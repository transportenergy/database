repos:
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.3.1
  hooks:
  - id: mypy
    additional_dependencies:
    - click
    - filelock
    - iam-units
    - Jinja2
    - lxml-stubs
    - pandas-stubs
    - Pint
    - plotnine
    - pycountry
    - pytest
    - sdmx1
    - traitlets
    - types-PyYAML
    - types-python-dateutil
    - types-requests
    - xarray
    args: []
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.7
  hooks:
  - id: ruff-check
  - id: ruff-format
    args: [ --check ]
